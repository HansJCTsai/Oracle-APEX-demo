name: Deploy APEX app

# 流程：push → 先匯入「暫時副本」用 Playwright 驗證 → 通過才部署 DEV → （選配）核准後部署 PROD
# 驗證用的是另一個 App ID 的暫時副本（正式 App ID + 1000），測完就刪除，不會動到 DEV 現有的 App。
# 也可以在 Actions 頁面手動按「Run workflow」
on:
  push:
    branches: [main]
    paths: ['apex/**', 'tests/**']
  workflow_dispatch:
    inputs:
      expected_text:
        description: '（選填）臨時指定驗證要找的文字；故意填錯可示範測試失敗'
        required: false
        default: ''

# 同一時間只讓一個部署在跑，避免互相覆蓋
concurrency:
  group: apex-deploy
  cancel-in-progress: false

jobs:
  # 第 1 關：把新版匯入成暫時副本 → Playwright 登入並檢查畫面 → 刪除副本
  # 需要的設定（沒設定時這個 job 會自動略過，直接部署）：
  #   dev 環境 Secrets：APEX_TEST_USER、APEX_TEST_PASSWORD（APEX 開發者帳號 DEVUSER）
  #   Repository variable：APEX_APP_URL（App 登出狀態的登入網址，格式 https://…/ords/r/<workspace>/<別名>/login）
  verify-stage:
    name: Verify before deploy (Playwright)
    if: ${{ vars.APEX_APP_URL != '' }}
    runs-on: ubuntu-latest
    environment: dev
    env:
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_SERVICE: ${{ secrets.DB_SERVICE }}
      APEX_WORKSPACE: ${{ vars.APEX_WORKSPACE }}
      APEX_APP_ID: ${{ vars.APEX_APP_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17 (SQLcl 需要)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SQLcl
        run: |
          curl -sSL -o sqlcl.zip https://download.oracle.com/otn_software/java/sqldeveloper/sqlcl-latest.zip
          unzip -q sqlcl.zip
          echo "$PWD/sqlcl/bin" >> "$GITHUB_PATH"

      - name: Restore wallet
        run: echo "${{ secrets.WALLET_B64 }}" | base64 -d > wallet.zip

      - name: Compute stage app id and URL
        env:
          DEV_APP_URL: ${{ vars.APEX_APP_URL }}
        run: |
          STAGE_ID=$(( APEX_APP_ID + 1000 ))
          # 把網址裡的 App 別名換成暫時副本的別名（stg<ID>），其他部分不變
          STAGE_URL=$(echo "$DEV_APP_URL" | sed -E "s#/r/([^/]+)/[^/]+/(.*)#/r/\1/stg${STAGE_ID}/\2#")
          if [ "$STAGE_URL" = "$DEV_APP_URL" ]; then
            echo "::error::APEX_APP_URL 格式不符，需為 https://…/ords/r/<workspace>/<別名>/login"
            exit 1
          fi
          echo "Stage URL: $STAGE_URL"
          echo "STAGE_ID=$STAGE_ID" >> "$GITHUB_ENV"
          echo "APEX_APP_URL=$STAGE_URL" >> "$GITHUB_ENV"

      - name: Import STAGE copy (不會動到正式 App)
        run: |
          sql -S -cloudconfig wallet.zip \
            "$DB_USER/$DB_PASSWORD@$DB_SERVICE" \
            @scripts/stage_deploy.sql "$APEX_WORKSPACE" "$APEX_APP_ID" "$DB_USER" "$STAGE_ID"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests against STAGE copy
        env:
          APEX_TEST_USER: ${{ secrets.APEX_TEST_USER }}
          APEX_TEST_PASSWORD: ${{ secrets.APEX_TEST_PASSWORD }}
          EXPECTED_TEXT: ${{ inputs.expected_text }}   # 手動執行時填的文字；push 觸發時為空，改讀 tests/expected.txt
        run: npx playwright test

      - name: Upload screenshot and report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      # 不管測試成功或失敗，都把暫時副本刪掉
      - name: Remove STAGE copy
        if: ${{ always() }}
        run: |
          sql -S -cloudconfig wallet.zip \
            "$DB_USER/$DB_PASSWORD@$DB_SERVICE" \
            @scripts/stage_remove.sql "$APEX_WORKSPACE" "$STAGE_ID"

  # 第 2 關：驗證通過（或沒設定驗證而略過）才部署 DEV；驗證失敗或被取消就不部署
  deploy-dev:
    name: Deploy to DEV
    needs: verify-stage
    if: ${{ always() && (needs.verify-stage.result == 'success' || needs.verify-stage.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: dev            # 在 Settings → Environments 建立 dev，放 DEV 的 Secrets
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17 (SQLcl 需要)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SQLcl
        run: |
          curl -sSL -o sqlcl.zip https://download.oracle.com/otn_software/java/sqldeveloper/sqlcl-latest.zip
          unzip -q sqlcl.zip
          echo "$PWD/sqlcl/bin" >> "$GITHUB_PATH"

      - name: Restore wallet
        run: echo "${{ secrets.WALLET_B64 }}" | base64 -d > wallet.zip

      - name: Import APEX application
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SERVICE: ${{ secrets.DB_SERVICE }}        # 例如 devopsserver_high
          APEX_WORKSPACE: ${{ vars.APEX_WORKSPACE }}
          APEX_APP_ID: ${{ vars.APEX_APP_ID }}
        run: |
          sql -S -cloudconfig wallet.zip \
            "$DB_USER/$DB_PASSWORD@$DB_SERVICE" \
            @scripts/deploy.sql "$APEX_WORKSPACE" "$APEX_APP_ID" "$DB_USER"
